# Light local hooks: secret scanning and basic file checks only. The full checks
# (lint, types, formatting, build) run in CI, not here. Install with: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # The baseline itself, and the two data files that only hold upstream
        # release hashes (regenerated when dependencies or tools change):
        # scanning them produces false positives, not findings.
        exclude: '(\.secrets\.baseline|build/third-party-notices\.json|public/tool-libraries/provenance\.json)$'
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
