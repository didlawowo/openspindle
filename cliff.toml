# git-cliff: the next version and the changelog, from the Conventional Commits on
# `main` (the `release` job of .github/workflows/release.yml).
#
# Only the types README.md's Pull requests section puts in the release notes cut a
# release: feat, fix, perf and revert. A run that merges docs, style, refactor,
# test, build, ci or chore commits alone publishes nothing (`released=false`), and
# no tag is made.

[changelog]
header = """
# Changelog

Every notable change to OpenSpindle, newest first. The project follows
[semantic versioning](https://semver.org/) and
[Conventional Commits](https://www.conventionalcommits.org/).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}\
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} [**BREAKING**]{% endif %}
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
filter_commits = false

commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^revert", group = "Reverts" },
  # Everything else is a change to how the project is built or documented, not to
  # what the app does: kept out of the notes, and out of what decides a version.
  { message = "^docs", skip = true },
  { message = "^style", skip = true },
  { message = "^refactor", skip = true },
  { message = "^test", skip = true },
  { message = "^build", skip = true },
  { message = "^ci", skip = true },
  { message = "^chore", skip = true },
  { body = ".*security", group = "Security" },
  { message = ".*", group = "Other" },
]
